name: Windows Build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"
      - "app/**"
      - "installer/**"
      - "main.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"
      - "app/**"
      - "installer/**"
      - "main.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid application version: $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Generate acceptance screenshots and documents
        shell: pwsh
        env:
          PYTHONPATH: "."
          QT_QPA_PLATFORM: offscreen
          PIPEERP_GUI_SMOKE: "1"
          PIPEERP_DATA_DIR: .pipeerp-windows-acceptance-data
        run: |
          python -m pytest -q tests/test_weight_invoice_statement_acceptance.py
          $required = @(
            ".pipeerp-acceptance-artifacts\weight-invoice-screen.png",
            ".pipeerp-acceptance-artifacts\customer-statement-screen.png",
            ".pipeerp-acceptance-artifacts\weight-invoice-sample.pdf",
            ".pipeerp-acceptance-artifacts\customer-statement-sample.pdf",
            ".pipeerp-acceptance-artifacts\customer-statement-sample.xlsx"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Acceptance artifact is missing: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Acceptance artifact is empty: $path" }
          }

      - name: Upload acceptance screenshots and documents
        uses: actions/upload-artifact@v4
        with:
          name: PipeERP-Weight-Invoice-Customer-Statement-Acceptance
          path: .pipeerp-acceptance-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Generate Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          @'
          from pathlib import Path
          from PIL import Image
          source = Path("app/assets/print/default_logo.png")
          target = Path("build/PipeERP.ico")
          image = Image.open(source).convert("RGBA")
          image.save(target, format="ICO", sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])
          '@ | python -

      - name: Build standalone application
        shell: pwsh
        run: |
          $windowsVersion = "${env:APP_VERSION}.0"
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=build/PipeERP.ico `
            --include-package=tzdata `
            --include-package-data=tzdata `
            --include-data-dir=app/assets=app/assets `
            --output-dir=build/windows `
            --output-filename=PipeERP.exe `
            --company-name="3A PIPE" `
            --product-name="PipeERP" `
            --file-description="3A PIPE ERP" `
            --file-version="$windowsVersion" `
            --product-version="$windowsVersion" `
            main.py
          if (-not (Test-Path "build/windows/main.dist/PipeERP.exe")) {
            throw "Nuitka executable was not produced"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\PipeERP.iss"
          $installer = "dist\installer\PipeERP-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not produced" }
          if ((Get-Item $installer).Length -lt 1000000) { throw "Installer size is unexpectedly small" }

      - name: Validate silent install and database preservation
        shell: pwsh
        run: |
          function Invoke-CheckedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$TimeoutSeconds = 180
            )
            Write-Host "Starting: $Label"
            $parameters = @{
              FilePath = $FilePath
              PassThru = $true
            }
            if ($Arguments.Count -gt 0) {
              $parameters.ArgumentList = $Arguments
            }
            $process = Start-Process @parameters
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$Label timed out after $TimeoutSeconds seconds"
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "$Label failed with exit code $($process.ExitCode)"
            }
            Write-Host "Completed: $Label"
          }

          $installer = (Resolve-Path "dist\installer\PipeERP-Setup-$env:APP_VERSION.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "PipeERP-Installed"
          $dataDir = Join-Path $env:RUNNER_TEMP "PipeERP-UserData"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $installLog = Join-Path $env:RUNNER_TEMP "pipeerp-install.log"
          $updateLog = Join-Path $env:RUNNER_TEMP "pipeerp-update.log"
          $baseInstallerArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          )
          Invoke-CheckedProcess `
            -FilePath $installer `
            -Arguments ($baseInstallerArgs + "/LOG=$installLog") `
            -Label "Silent installation"
          $exe = Join-Path $installDir "PipeERP.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable is missing" }
          $env:PIPEERP_DATA_DIR = $dataDir
          $env:PIPEERP_SMOKE_TEST = "1"
          Invoke-CheckedProcess `
            -FilePath $exe `
            -Label "Installed executable smoke test" `
            -TimeoutSeconds 120
          $databasePath = Join-Path $dataDir "pipeerp.sqlite3"
          if (-not (Test-Path $databasePath)) { throw "Smoke test database was not created" }
          @'
          import os, sqlite3
          from pathlib import Path
          db = Path(os.environ["PIPEERP_DATA_DIR"]) / "pipeerp.sqlite3"
          with sqlite3.connect(db) as con:
              con.execute("INSERT OR REPLACE INTO settings(key, value) VALUES (?, ?)", ("installer_preservation", "kept"))
          '@ | python -
          Invoke-CheckedProcess `
            -FilePath $installer `
            -Arguments ($baseInstallerArgs + "/LOG=$updateLog") `
            -Label "Silent update"
          @'
          import os, sqlite3
          from pathlib import Path
          db = Path(os.environ["PIPEERP_DATA_DIR"]) / "pipeerp.sqlite3"
          with sqlite3.connect(db) as con:
              value = con.execute("SELECT value FROM settings WHERE key = ?", ("installer_preservation",)).fetchone()
          assert value == ("kept",), value
          '@ | python -
          Invoke-CheckedProcess `
            -FilePath $exe `
            -Label "Post-update executable smoke test" `
            -TimeoutSeconds 120

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = "dist\installer\PipeERP-Setup-$env:APP_VERSION.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PipeERP-Setup-$env:APP_VERSION.exe" | Set-Content "dist\installer\PipeERP-Setup-$env:APP_VERSION.exe.sha256"
          Write-Host "Installer SHA256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PipeERP-Windows-Release
          path: |
            dist/installer/PipeERP-Setup-*.exe
            dist/installer/PipeERP-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
