name: Publish PipeERP Release

on:
  workflow_run:
    workflows: ["Windows Build"]
    types: [completed]
    branches: [main]

jobs:
  release:
    permissions:
      actions: read
      contents: write
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify all main quality gates
        uses: actions/github-script@v7
        with:
          script: |
            const required = new Set([
              "Feature Validation",
              "PipeERP Quality Checks",
              "PipeERP Smoke Tests",
              "Windows Build",
            ]);
            const sha = context.payload.workflow_run.head_sha;
            for (let attempt = 0; attempt < 30; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const latest = new Map();
              for (const run of response.data.workflow_runs) {
                if (!required.has(run.name)) continue;
                const current = latest.get(run.name);
                if (!current || new Date(run.created_at) > new Date(current.created_at)) {
                  latest.set(run.name, run);
                }
              }
              const pending = [...required].filter((name) => {
                const run = latest.get(name);
                return !run || run.status !== "completed";
              });
              const failed = [...required].filter((name) => {
                const run = latest.get(name);
                return run && run.status === "completed" && run.conclusion !== "success";
              });
              if (failed.length) {
                core.setFailed(`Main quality gates failed: ${failed.join(", ")}`);
                return;
              }
              if (!pending.length) {
                core.info("All main quality gates succeeded.");
                return;
              }
              core.info(`Waiting for: ${pending.join(", ")}`);
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            core.setFailed("Timed out waiting for all main quality gates.");

      - name: Download validated Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PipeERP-Windows-Release
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve release metadata
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          installer="PipeERP-Setup-${version}.exe"
          checksum="${installer}.sha256"
          test -s "release-assets/${installer}"
          test -s "release-assets/${checksum}"
          grep -Fq "# PipeERP v${version}" docs/RELEASE_NOTES.md
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "INSTALLER_NAME=${installer}" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=${checksum}" >> "$GITHUB_ENV"

      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check "$CHECKSUM_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; keeping its published assets unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "release-assets/${INSTALLER_NAME}" \
            "release-assets/${CHECKSUM_NAME}" \
            --target "$TARGET_SHA" \
            --title "PipeERP ${tag}" \
            --notes-file docs/RELEASE_NOTES.md
