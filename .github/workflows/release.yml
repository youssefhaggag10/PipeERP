name: Publish PipeERP Release

on:
  workflow_run:
    workflows: ["Windows Build", "PipeERP Quality Checks"]
    types: [completed]
    branches: [main]

jobs:
  release:
    permissions:
      actions: read
      contents: write
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve validated Windows build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            let source;
            if (context.payload.workflow_run.name === "Windows Build") {
              source = context.payload.workflow_run;
            } else {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: "main",
                status: "success",
                per_page: 100,
              });
              source = response.data.workflow_runs.find(
                (run) => run.name === "Windows Build" && run.conclusion === "success"
              );
            }
            if (!source) {
              core.setFailed("No successful Windows Build was found on main.");
              return;
            }
            core.setOutput("run_id", String(source.id));
            core.setOutput("head_sha", source.head_sha);
            core.info(`Using Windows Build ${source.id} at ${source.head_sha}.`);

      - name: Verify all main quality gates
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        with:
          script: |
            const required = new Set([
              "Feature Validation",
              "PipeERP Quality Checks",
              "PipeERP Smoke Tests",
              "Windows Build",
            ]);
            const sha = process.env.SOURCE_SHA;
            for (let attempt = 0; attempt < 30; attempt++) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const latest = new Map();
              for (const run of response.data.workflow_runs) {
                if (!required.has(run.name)) continue;
                const current = latest.get(run.name);
                if (!current || new Date(run.created_at) > new Date(current.created_at)) {
                  latest.set(run.name, run);
                }
              }
              const pending = [...required].filter((name) => {
                const run = latest.get(name);
                return !run || run.status !== "completed";
              });
              const failed = [...required].filter((name) => {
                const run = latest.get(name);
                return run && run.status === "completed" && run.conclusion !== "success";
              });
              if (failed.length) {
                core.setFailed(`Main quality gates failed: ${failed.join(", ")}`);
                return;
              }
              if (!pending.length) {
                core.info("All main quality gates succeeded.");
                return;
              }
              core.info(`Waiting for: ${pending.join(", ")}`);
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            core.setFailed("Timed out waiting for all main quality gates.");

      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          persist-credentials: false

      - name: Download validated Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PipeERP-Windows-Release
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Resolve release metadata
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          installer="PipeERP-Setup-${version}.exe"
          checksum="${installer}.sha256"
          test -s "release-assets/${installer}"
          test -s "release-assets/${checksum}"
          grep -Fq "# PipeERP v${version}" docs/RELEASE_NOTES.md
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "INSTALLER_NAME=${installer}" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=${checksum}" >> "$GITHUB_ENV"

      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check "$CHECKSUM_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; keeping its published assets unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "release-assets/${INSTALLER_NAME}" \
            "release-assets/${CHECKSUM_NAME}" \
            --target "$TARGET_SHA" \
            --title "PipeERP ${tag}" \
            --notes-file docs/RELEASE_NOTES.md
