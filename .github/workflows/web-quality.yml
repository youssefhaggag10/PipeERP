name: Web quality

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [web-rebuild]
    paths:
      - "web/**"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pipeerp_test
          POSTGRES_USER: pipeerp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeerp_test -d pipeerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pipeerp_test@localhost:5432/pipeerp_test
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app.domain --cov=app.modules.identity --cov=app.modules.master_data --cov=app.api.routes.master_data --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
