name: Web quality

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [web-rebuild]
    paths:
      - "web/**"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app.domain --cov-report=term-missing --cov-fail-under=90
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
