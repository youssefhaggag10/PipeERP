<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختار شخصيتي معاك اليوم</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#171923;
      --muted:#6b7280;
      --accent:#25D366;
      --border:#e5e7eb;
      --shadow:0 10px 30px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      background:linear-gradient(180deg,#eefaf2 0,#f6f7fb 220px);
      color:var(--text);
    }
    .wrap{max-width:760px;margin:auto;padding:24px 16px 50px}
    .hero{text-align:center;padding:24px 12px 18px}
    .badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#dcfce7;color:#166534;font-size:13px;font-weight:700;margin-bottom:12px}
    h1{font-size:30px;line-height:1.3;margin:0 0 10px}
    .sub{color:var(--muted);font-size:15px;line-height:1.8;margin:auto;max-width:560px}
    .search{width:100%;margin:18px 0 8px;border:1px solid var(--border);border-radius:16px;padding:14px 16px;font-size:16px;outline:none;background:white;box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
    .trait{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.16s ease;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center}
    .trait:active{transform:scale(.98)}
    .emoji{font-size:35px;margin-bottom:8px}
    .name{font-size:18px;font-weight:800}
    .desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
    .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7}
    .toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#111827;color:white;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
    .toast.show{opacity:1}
    @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="badge">اختيار اليوم ✨</div>
      <h1>تحب أتعامل معاك بإيه النهارده؟</h1>
      <p class="sub">اختار صفة واحدة، وهتتفتح لك رسالة جاهزة على واتساب تقول اختيارك.</p>
    </section>
    <input id="search" class="search" type="search" placeholder="دوّر على صفة...">
    <div id="grid" class="grid"></div>
    <div class="footer">الاختيار لا يغيّر معلوماتك أو بياناتك، هو مجرد أسلوب تعامل لليوم.</div>
  </div>
  <div id="toast" class="toast">جاري فتح واتساب...</div>
<script>
const traits = [
  {e:"😴", n:"الكسول", d:"يحب التأجيل ويختار أسهل طريق"},
  {e:"❤️", n:"الرومانسي", d:"دافئ وعاطفي ويهتم بالتفاصيل"},
  {e:"🥰", n:"الحنون", d:"لطيف ومتعاطف ويميل للاحتواء"},
  {e:"😏", n:"النرجسي", d:"يحب التقدير ويركّز على نفسه"},
  {e:"😂", n:"الكوميدي", d:"خفيف دم ويحوّل الكلام لمواقف مضحكة"},
  {e:"🧊", n:"البارد", d:"هادئ، مختصر، قليل الانفعال"},
  {e:"😤", n:"العصبي", d:"سريع الضيق وقليل الصبر"},
  {e:"💰", n:"الطماع", d:"يفكر في المكسب والمنفعة أولًا"},
  {e:"😎", n:"الواثق", d:"حاسم وجرئ في قراراته"},
  {e:"🙈", n:"الخجول", d:"هادئ ومتردد في التعبير"},
  {e:"🤔", n:"المتردد", d:"يفكر كثيرًا قبل كل قرار"},
  {e:"👑", n:"المتكبر", d:"يتعامل بإحساس تفوق واضح"},
  {e:"🧐", n:"الشكاك", d:"لا يقتنع بسهولة ويحلّل النوايا"},
  {e:"🤑", n:"البخيل", d:"يهتم بالتوفير ويتجنب المصاريف"},
  {e:"🎯", n:"الطموح", d:"يركّز على الإنجاز وتحقيق الأهداف"},
  {e:"😈", n:"المشاكس", d:"يحب الاستفزاز والهزار الخفيف"},
  {e:"🧠", n:"العقلاني", d:"يعتمد على المنطق أكثر من المشاعر"},
  {e:"🥺", n:"الحساس", d:"يتأثر بالكلام والمواقف بسرعة"},
  {e:"🤝", n:"الوفي", d:"مخلص ويحافظ على العلاقات"},
  {e:"🔥", n:"المتحمس", d:"طاقة عالية وحماس واضح"},
  {e:"🌿", n:"الهادئ", d:"يتعامل بهدوء وبدون توتر"},
  {e:"🕵️", n:"الفضولي", d:"يسأل كثيرًا ويحب معرفة التفاصيل"},
  {e:"📏", n:"المنظم", d:"يرتّب كل شيء ويحب الوضوح"},
  {e:"🎲", n:"العفوي", d:"يتصرف بتلقائية ويحب المفاجآت"}
];
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const toast = document.getElementById("toast");
function openWhatsApp(trait){
  const msg = `🎭 *اختياري لليوم*\n\n╭──────────────╮\n   ${trait.e} *${trait.n}*\n╰──────────────╯\n\n✨ اتعامل معايا النهارده بالشخصية دي\nوخلي نشوف اليوم هيمشي إزاي 😄\n\n🔄 بكرة ممكن أختارلك شخصية تانية!`;
  const url = "https://wa.me/201286943244?text=" + encodeURIComponent(msg);
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1200);
  window.location.href = url;
}
function render(list){
  grid.innerHTML = "";
  list.forEach(t=>{
    const card = document.createElement("button");
    card.className = "trait";
    card.type = "button";
    card.innerHTML = `<div class="emoji">${t.e}</div><div class="name">${t.n}</div><div class="desc">${t.d}</div>`;
    card.addEventListener("click",()=>openWhatsApp(t));
    grid.appendChild(card);
  });
}
search.addEventListener("input",()=>{const q = search.value.trim(); render(traits.filter(t => (t.n+" "+t.d).includes(q)));});
render(traits);
</script>
</body>
</html>
